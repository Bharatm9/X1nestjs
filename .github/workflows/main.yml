name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    # Step 1: Checkout repo
    - uses: actions/checkout@v4

    # Step 2: Setup Node
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm ci

    # ✅ Step 4: Create .env file only for build context
    - name: Create .env file
      run: |
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

    # Step 5: Prisma Generate (client only)
    - name: Generate Prisma Client
      run: npm run prisma:generate

    # ❌ Removed Prisma migrate deploy from GitHub Actions
    # (it will run on server)

    # Step 6: Run tests
    - name: Run Tests
      run: npm test

    # Step 7: Build project
    - name: Build Project
      run: |
        npm run build
        mkdir -p dist/src/views
        cp -r src/views/* dist/src/views/ || echo "No views folder found"

    # Step 8: Run ESLint
    - name: Run ESLint
      run: npm run lint

    # Step 9: Upload coverage reports
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

