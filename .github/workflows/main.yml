name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] # updated node version

    steps:
    # Step 1: Checkout repo
    - uses: actions/checkout@v4

    # Step 2: Setup Node
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm ci

    # Step 4: Prisma Generate
    - name: Generate Prisma Client
      run: npm run prisma:generate

    # Step 5: Prisma migrate (Production safe)
    - name: Run Prisma Migrate Deploy
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    # Step 6: Run tests
    - name: Run Tests
      run: npm test

    # Step 7: Build project
    - name: Build Project
      run: |
        npm run build
        mkdir -p dist/src/views
        cp -r src/views/* dist/src/views/ || echo "No views folder found"

    # Step 8: Run ESLint
    - name: Run ESLint
      run: npm run lint

    # Step 9: Upload coverage
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

