name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]  # ✅ Updated from 18.x → 20.x

    steps:
    # Step 1: Checkout repo
    - uses: actions/checkout@v4

    # Step 2: Setup Node.js
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm ci

    # Step 4: Generate Prisma Client
    - name: Generate Prisma Client
      run: npx prisma generate

    # Step 5: Run tests
    - name: Run tests
      run: npm test

    # Step 6: Build project safely for Linux
    - name: Build project
      run: |
        npm run build
        # If build script still uses xcopy, manually copy views here:
        mkdir -p dist/src/views
        cp -r src/views/* dist/src/views/ || echo "No views folder found"

    # Step 7: Cache node modules
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    # Step 8: Run ESLint
    - name: Run ESLint
      run: npm run lint
      if: success()

    # Step 9: Upload coverage reports
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
      if: success()

    # Step 10: (Optional) Deploy step
    # - name: Deploy
    #   if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    #   run: |
    #     echo "Add your deployment commands here"
    #   env:
    #     DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
