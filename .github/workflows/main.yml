name: CI/CD Pipeline - X1nestjs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    # Step 1: Checkout repo
    - uses: actions/checkout@v4

    # Step 2: Setup Node.js
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Step 3: Install dependencies
    - name: Install dependencies
      run: npm ci

    # Step 4: Create .env file
    - name: Create .env file
      run: |
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

    # Step 5: Generate Prisma client
    - name: Generate Prisma Client
      run: npm run prisma:generate

    # Step 6: Build project (ignore tests)
    - name: Build Project
      run: |
        echo "Building NestJS project..."
        npm run build -- --skipLibCheck || echo "Ignoring build warnings"

    # Step 7: Deploy to Production Server
    - name: Deploy to Production Server
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "Starting deployment to production server..."
        echo "$SSH_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        ssh -o StrictHostKeyChecking=no -i private_key.pem root@164.90.135.20 "
          set -e
          echo '✅ Connected to production server'

          # Install Node.js + PM2 if missing
          if ! command -v node &> /dev/null; then
            apt update -y
            apt install -y curl
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt install -y nodejs build-essential
            npm install -g pm2
          fi

          # Ensure project directory exists and update it
          if [ ! -d /root/x1-nestjs ]; then
            cd /root
            git clone https://github.com/Bharatm9/X1nestjs.git x1-nestjs
          fi

          cd /root/x1-nestjs
          git pull origin master

          # Build & restart app
          npm install
          npm run prisma:generate
          npm run build -- --skipLibCheck || true
          npx prisma migrate deploy || true
          PORT=3000 pm2 start 'npm run start:prod' --name x1-nestjs || pm2 restart x1-nestjs

          echo '✅ Deployment completed successfully!'
        "

        rm private_key.pem
