name: CI/CD Pipeline - X1 NestJS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    # Step 1: Checkout repo
    - uses: actions/checkout@v4

    # Step 2: Setup Node.js
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # ✅ Step 3: Safe dependency install (handles mismatched lockfiles)
    - name: Install dependencies
      run: |
        echo "Installing dependencies (safe mode)..."
        npm install || npm ci

    # ✅ Step 4: Create .env file for DATABASE_URL
    - name: Create .env file
      run: |
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

    # Step 5: Generate Prisma Client
    - name: Generate Prisma Client
      run: npm run prisma:generate

    # Step 6: Run Tests
    - name: Run Tests
      run: npm test

    # Step 7: Run Lint
    - name: Run ESLint
      run: npm run lint

    # ✅ Step 8: Build Project
    - name: Build Project
      run: npm run build

    # Step 9: Upload Coverage Report (optional)
    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

    # ✅ Step 10: Deploy to Production Server
    - name: Deploy to Production
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "Starting deployment to production server..."
        echo "$SSH_KEY" > private_key.pem
        chmod 600 private_key.pem

        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@YOUR_SERVER_IP "
          cd /path/to/x1-nestjs &&
          git pull &&
          npm install &&
          npm run prisma:generate &&
          npm run build &&
          export DATABASE_URL='${DATABASE_URL}' &&
          npx prisma migrate deploy &&
          PORT=3000 pm2 start 'npm run start:prod' --name x1-nestjs || pm2 restart x1-nestjs
        "

        rm private_key.pem
